<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cadence gyroscope mark. A favicon is a static file, so the three CSS-3D
       rings are flattened to their resting poses: rotateX(68°) reads as a wide
       ellipse, rotateY(68°) as a narrow one, and the compound rotation as a
       tilted one. Dark plate, matching the app-icon treatment. -->
  <rect width="32" height="32" rx="7" fill="#17140f"/>
  <g fill="none" stroke-width="1.7">
    <ellipse cx="16" cy="16" rx="11.5" ry="4.3" stroke="#e8a13d"/>
    <ellipse cx="16" cy="16" rx="4.3" ry="11.5" stroke="#c9862a"/>
    <ellipse cx="16" cy="16" rx="3.4" ry="10" stroke="#f3c877" transform="rotate(42 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="2.3" fill="#f3ecdf"/>
</svg>
