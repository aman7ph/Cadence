<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cadence gyroscope mark. A favicon is a static file, so the three CSS-3D
       rings are flattened to their resting poses: rotateX(68°) reads as a wide
       ellipse, rotateY(68°) as a narrow one, and the compound rotation as a
       tilted one.

       No plate — the mark sits on the browser's own tab colour. That makes the
       centre dot the one problem: it is --text-primary, which is cream, and
       cream vanishes on a light tab. An SVG favicon can carry its own stylesheet,
       so the dot follows the viewer's scheme while the gold rings, which read on
       both, stay fixed. -->
  <style>
    .cad-dot { fill: #17140f; }
    @media (prefers-color-scheme: dark) {
      .cad-dot { fill: #f3ecdf; }
    }
  </style>
  <g fill="none" stroke-width="1.7">
    <ellipse cx="16" cy="16" rx="11.5" ry="4.3" stroke="#e8a13d"/>
    <ellipse cx="16" cy="16" rx="4.3" ry="11.5" stroke="#c9862a"/>
    <ellipse cx="16" cy="16" rx="3.4" ry="10" stroke="#f3c877" transform="rotate(42 16 16)"/>
  </g>
  <circle class="cad-dot" cx="16" cy="16" r="2.3"/>
</svg>
